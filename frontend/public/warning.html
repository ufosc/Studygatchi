<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studygatchi warning</title>
    <style>
      body {
        align-items: center;
        background: #17151c;
        color: #f7f0e8;
        display: flex;
        font-family: sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }
      main {
        background: #2b2633;
        border: 2px solid #e89272;
        border-radius: 12px;
        box-sizing: border-box;
        max-width: 560px;
        padding: 2rem;
        text-align: center;
        width: calc(100% - 2rem);
      }
      h1 { color: #ffb08e; margin-top: 0; }
      .site { font-weight: bold; overflow-wrap: anywhere; }
      .warning { color: #ffb08e; font-size: 1.15rem; }
      button { border: 0; border-radius: 6px; cursor: pointer; font-size: 1rem; margin: 0.35rem; padding: 0.7rem 1rem; }
      #back { background: #f7f0e8; color: #17151c; }
      #proceed { background: #e89272; color: #17151c; }
    </style>
  </head>
  <body>
    <main>
      <h1>Locked-in warning</h1>
      <p class="site" id="site"></p>
      <p class="warning">If you continue, your Goober will lose 10 health.</p>
      <p>Are you sure you want to proceed to this site while the timer is running?</p>
      <button id="back" type="button">Go back</button>
      <button id="proceed" type="button">Proceed anyway</button>
    </main>
    <script src="warning.js"></script>
  </body>
</html>
